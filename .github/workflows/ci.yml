name: CI

on:
  push:
    branches: [ main, root ]
  pull_request:
    branches: [ main, root ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11.11]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget curl pkg-config

    - name: Install TA-Lib from PPA
      run: |
        sudo add-apt-repository ppa:mario-mariomedina/talib
        sudo apt-get update
        sudo apt-get install -y libta-lib0 ta-lib0-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        # Install numpy first to ensure correct version
        pip install 'numpy<1.25.0'
        # Install TA-Lib from pre-built wheel
        pip install --no-cache-dir https://files.pythonhosted.org/packages/e6/c4/8c00e3c0b9d8c5b5e2b2d3d8e1c7e3f3f08e9c0d2e8a4b9f0d3e9a1c7e7/TA_Lib-0.4.24-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        # Now install other requirements
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort
    
    - name: Check code formatting
      run: |
        black --check .
        isort --check-only .
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with coverage
      run: |
        pytest --cov=src tests/ --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true 