name: CI

on:
  push:
    branches: [ main, root ]
  pull_request:
    branches: [ main, root ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11.11]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential wget curl pkg-config automake libtool

    - name: Install TA-Lib
      run: |
        # Download and extract source
        curl -L -o ta-lib-0.4.0-src.tar.gz http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        # Build and install
        ./configure --prefix=/usr
        make
        sudo make install
        # Create symlink with correct name
        sudo ln -s /usr/lib/libta_lib.so.0 /usr/lib/libta-lib.so
        # Update the shared library cache
        sudo ldconfig
        # Verify the library is installed and linked
        ls -l /usr/lib/libta*
        ldconfig -p | grep ta
        # Clean up
        cd ..
        rm -rf ta-lib-0.4.0-src.tar.gz ta-lib/
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel setuptools
        # Install numpy first to ensure correct version
        pip install 'numpy<1.25.0'
        # Install TA-Lib with verbose output and explicit lib path
        export LD_LIBRARY_PATH=/usr/lib:$LD_LIBRARY_PATH
        CFLAGS="-I/usr/include/ta-lib" LDFLAGS="-L/usr/lib" pip install --no-cache-dir --verbose ta-lib
        # Now install other requirements
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort
    
    - name: Check code formatting
      run: |
        black --check .
        isort --check-only .
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with coverage
      run: |
        pytest --cov=src tests/ --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true 